name: project-iz-production

x-logging: &logging
  driver: json-file
  options:
    max-size: "10m"
    max-file: "3"

x-app-environment: &app-environment
  NODE_ENV: production
  DATABASE_URL: postgresql://iz:${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env}@db:5432/iz
  BETTER_AUTH_URL: https://${APP_DOMAIN:?Set APP_DOMAIN in .env}
  S3_ENDPOINT: http://storage:9000
  CLAMAV_HOST: scanner
  CLAMAV_PORT: "3310"

x-jobs-build: &jobs-build
  context: .
  target: worker

services:
  db:
    image: postgres:17-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: iz
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env}
      POSTGRES_DB: iz
    volumes:
      - postgres:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U iz -d iz"]
      interval: 5s
      timeout: 3s
      retries: 20
    logging: *logging

  storage:
    image: minio/minio:RELEASE.2025-04-22T22-12-26Z
    command: server /data --console-address :9001
    restart: unless-stopped
    environment:
      MINIO_ROOT_USER: ${S3_ACCESS_KEY_ID:?Set S3_ACCESS_KEY_ID in .env}
      MINIO_ROOT_PASSWORD: ${S3_SECRET_ACCESS_KEY:?Set S3_SECRET_ACCESS_KEY in .env}
    volumes:
      - files:/data
    logging: *logging

  scanner:
    image: clamav/clamav:stable
    restart: unless-stopped
    volumes:
      - signatures:/var/lib/clamav
    logging: *logging

  initialize:
    build: *jobs-build
    env_file: .env
    environment: *app-environment
    command: ["pnpm", "exec", "tsx", "scripts/initialize.ts"]
    depends_on:
      db:
        condition: service_healthy
      storage:
        condition: service_started
    logging: *logging

  web:
    build:
      context: .
      target: runner
    restart: unless-stopped
    env_file: .env
    environment:
      <<: *app-environment
      HOSTNAME: 0.0.0.0
      PORT: "3000"
    depends_on:
      initialize:
        condition: service_completed_successfully
    healthcheck:
      test:
        - CMD
        - node
        - -e
        - "fetch('http://127.0.0.1:3000/api/health').then(r=>r.json()).then(r=>process.exit(r.ready===true?0:1)).catch(()=>process.exit(1))"
      interval: 30s
      timeout: 5s
      start_period: 60s
      retries: 5
    stop_grace_period: 30s
    logging: *logging

  worker:
    build: *jobs-build
    restart: unless-stopped
    init: true
    env_file: .env
    environment: *app-environment
    command: ["node", "--import", "tsx", "scripts/worker.ts"]
    depends_on:
      initialize:
        condition: service_completed_successfully
      scanner:
        condition: service_started
    stop_grace_period: 30s
    logging: *logging

  telegram:
    build: *jobs-build
    profiles: ["telegram"]
    restart: unless-stopped
    init: true
    env_file: .env
    environment: *app-environment
    command: ["node", "--import", "tsx", "scripts/telegram-poll.ts"]
    depends_on:
      initialize:
        condition: service_completed_successfully
    stop_grace_period: 30s
    logging: *logging

  proxy:
    image: caddy:2-alpine
    restart: unless-stopped
    environment:
      APP_DOMAIN: ${APP_DOMAIN:?Set APP_DOMAIN in .env}
      ACME_EMAIL: ${ACME_EMAIL:?Set ACME_EMAIL in .env}
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./deploy/Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    depends_on:
      web:
        condition: service_started
    logging: *logging

volumes:
  postgres:
  files:
  signatures:
  caddy_data:
  caddy_config:
